[project]
name = "sentinel-fraud-review"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
# Kept in sync with requirements.txt by hand -- requirements.txt is what the
# Dockerfile / local `pip install -r requirements.txt` use; this list is
# what Vercel's `uv`-based Python builder reads. Update both together.
dependencies = [
  "langgraph>=0.2.60",
  "langchain>=0.3.7",
  "langchain-together>=0.3.0",
  "python-dotenv>=1.0.1",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sse-starlette>=2.1.0",
]

[tool.vercel]
entrypoint = "ui.server:app"
