<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel — Fraud Operations Chat</title>
<link rel="stylesheet" href="theme.css">
<style>
  .workspace{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start;height:calc(100vh - 100px);}

  /* ---------------------------------------------------------------- chat --- */
  .chat-col{display:flex;flex-direction:column;height:100%;}
  .chat-log{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
  .msg-row{display:flex;flex-direction:column;max-width:86%;}
  .msg-row.user{align-self:flex-end;align-items:flex-end;}
  .msg-row.assistant{align-self:flex-start;align-items:flex-start;}
  .bubble{font-size:13.5px;line-height:1.55;padding:10px 14px;border-radius:12px;}
  .msg-row.user .bubble{background:var(--signal-bg);color:var(--text);border:1px solid transparent;}
  .msg-row.assistant .bubble{background:var(--surface-raised);color:var(--text-2);border:1px solid var(--line);}
  .bubble p{margin:0 0 8px;}
  .bubble p:last-child{margin-bottom:0;}
  .bubble strong{color:var(--text);}
  .chat-empty{margin:auto;text-align:center;color:var(--text-3);font-size:13px;max-width:380px;}
  .chat-empty .suggestions{display:flex;flex-direction:column;gap:6px;margin-top:14px;}
  .suggestion-btn{font-size:12px;color:var(--text-2);background:var(--surface-raised);border:1px solid var(--line);
    border-radius:8px;padding:8px 12px;cursor:pointer;text-align:left;}
  .suggestion-btn:hover{border-color:var(--signal);color:var(--text);}

  .chat-input-row{display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--line);}
  .chat-input-row textarea{flex:1;resize:none;background:var(--ink);color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;font-size:13.5px;font-family:inherit;min-height:44px;max-height:140px;}
  .chat-input-row textarea:focus{border-color:var(--signal);}
  .chat-send{font-size:13px;font-weight:600;color:var(--signal);background:var(--signal-bg);
    border:1px solid transparent;border-radius:10px;padding:0 18px;cursor:pointer;}
  .chat-send:hover:not(:disabled){background:var(--signal);color:var(--ink);}
  .chat-send:disabled{opacity:0.4;cursor:default;}
  .thinking{color:var(--text-3);font-style:italic;}

  /* ---- case card rendered inside a chat bubble ---- */
  .case-card{border:1px solid var(--line);border-radius:10px;background:var(--ink);padding:10px 12px;margin-top:4px;min-width:280px;}
  .case-card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;font-weight:600;color:var(--text);}
  .case-card-meta{font-size:11px;color:var(--text-3);margin-top:2px;}
  .case-steps{display:flex;flex-direction:column;gap:4px;margin-top:8px;}
  .case-step{display:flex;gap:8px;font-size:11.5px;align-items:baseline;}
  .case-step .dot{width:6px;height:6px;border-radius:50%;flex:none;margin-top:4px;background:var(--text-3);}
  .case-step .dot.done{background:var(--good);}
  .case-step .dot.running{background:var(--signal);animation:pulse 1s ease-in-out infinite;}
  .case-step .dot.skip{background:transparent;border:1.5px dashed var(--text-3);}
  .case-step .dot.review{background:var(--warning);animation:pulse 1.4s ease-in-out infinite;}
  .case-step .label{font-weight:600;color:var(--text-2);flex:none;}
  .case-step .detail{color:var(--text-3);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}

  .case-score-line{margin-top:10px;font-size:13px;}
  .case-score-line .score{font-family:var(--font-mono);font-weight:600;color:var(--text);}
  .band-good{color:var(--good);} .band-warning{color:var(--warning);}
  .band-serious{color:var(--serious);} .band-critical{color:var(--critical);}
  .case-factors{margin-top:8px;display:flex;flex-direction:column;gap:10px;}
  .case-factor-head{font-size:11.5px;color:var(--text-3);margin-bottom:5px;}
  .case-factor-head b{color:var(--text-2);}
  .case-evidence-wrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:8px;}
  table.case-evidence{width:100%;border-collapse:collapse;font-size:11px;}
  table.case-evidence th{
    text-align:left;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;font-size:9.5px;
    color:var(--text-3);background:var(--surface-raised);padding:5px 8px;border-bottom:1px solid var(--line-soft);white-space:nowrap;
  }
  table.case-evidence td{padding:6px 8px;border-bottom:1px solid var(--line-soft);color:var(--text-2);vertical-align:top;}
  table.case-evidence tr:last-child td{border-bottom:none;}
  table.case-evidence td:first-child{color:var(--text);font-weight:600;white-space:nowrap;}
  .prov-badge{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;padding:2px 6px;border-radius:20px;white-space:nowrap;}
  .prov-badge.real{color:var(--signal);background:var(--signal-bg);}
  .prov-badge.simulated{color:var(--text-3);background:var(--surface-raised);}
  .case-narrative{margin-top:8px;font-size:12.5px;color:var(--text-2);line-height:1.5;border-top:1px solid var(--line-soft);padding-top:8px;}
  .case-actions{display:flex;gap:8px;margin-top:10px;}
  .case-actions .btn{padding:6px 12px;font-size:12px;}

  /* -------------------------------------------------------------- sidebar --- */
  .sidebar-col{display:flex;flex-direction:column;gap:14px;height:100%;overflow-y:auto;padding-right:2px;}
  .new-case-btn{width:100%;font-size:13px;padding:11px;}

  .form-panel{padding:14px 16px 16px;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:11px;color:var(--text-3);}
  .field input,.field select{background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:7px;
    padding:7px 9px;font-size:12.5px;}
  .field input:focus,.field select:focus{border-color:var(--signal);}
  .form-panel .btn.primary{width:100%;margin-top:4px;}

  .stat-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 16px;}
  .stat-tile{background:var(--surface-raised);border-radius:9px;padding:9px 11px;}
  .stat-tile .stat-label{font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-3);}
  .stat-tile .stat-value{font-family:var(--font-mono);font-size:19px;font-weight:600;color:var(--text);margin-top:2px;}

  .chart-block{padding:0 16px 14px;}
  .chart-title{font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-3);margin-bottom:8px;}
  .bar-row{display:grid;grid-template-columns:70px 1fr 26px;gap:8px;align-items:center;font-size:11px;color:var(--text-2);margin-bottom:5px;}
  .bar-track{height:8px;border-radius:4px;background:var(--surface-raised);overflow:hidden;}
  .bar-fill{height:100%;border-radius:4px;}
  .bar-fill.st-approve{background:var(--good);}
  .bar-fill.st-decline{background:var(--critical);}
  .bar-fill.st-escalated{background:var(--warning);}
  .bar-fill.st-pending{background:var(--signal);}
  .bar-count{text-align:right;font-family:var(--font-mono);}

  .trend-empty{font-size:11.5px;color:var(--text-3);padding:4px 0;}
  .trend-svg{width:100%;height:auto;overflow:visible;}
  .trend-line{fill:none;stroke:var(--signal);stroke-width:2;}
  .trend-threshold{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3;}
  .trend-dot{fill:var(--signal);}
  .trend-axis-label{fill:var(--text-3);font-size:8.5px;}

  .queue-panel{padding:0 8px 10px;}
  .queue-list{display:flex;flex-direction:column;max-height:260px;overflow-y:auto;}
  .queue-item{display:flex;align-items:stretch;gap:8px;padding:9px 8px;margin:1px 0;border-radius:9px;
    cursor:pointer;border:1px solid transparent;background:none;text-align:left;width:100%;}
  .queue-item:hover{background:var(--surface-hover);}
  .queue-item .stripe{width:3px;border-radius:3px;flex:none;}
  .queue-item .qi-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .queue-item .qi-merchant{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .queue-item .qi-meta{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-3);}
  .queue-empty{padding:14px 8px;font-size:12px;color:var(--text-3);}

  @media (max-width: 980px){
    .workspace{grid-template-columns:1fr;height:auto;}
    .chat-col{height:70vh;}
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 5.5V11c0 5.6 3.4 9.9 8 11 4.6-1.1 8-5.4 8-11V5.5L12 2z" stroke="#2563EB" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.5 12.2l2.4 2.4 4.6-4.9" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="wordmark">SENTINEL</span>
      </div>
      <span class="tagline">Payment fraud command center</span>
    </div>
    <nav class="page-nav">
      <a href="index.html" class="active">Chat</a>
      <a href="logs.html">Agent log</a>
      <a href="ontology.html">Ontology</a>
    </nav>
    <div class="live-status">
      <div class="live-dot-row"><span class="live-dot" id="liveDot"></span><span id="liveText">Connecting…</span></div>
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-3);">openai/gpt-oss-120b via Together AI</div>
    </div>
  </header>

  <div class="workspace">
    <section class="panel chat-col">
      <div class="chat-log" id="chatLog">
        <div class="chat-empty">
          Ask Sentinel to review a transaction, check on a case, or approve/decline one awaiting review.
          <div class="suggestions">
            <button class="suggestion-btn" data-msg="Submit a $2,340 electronics purchase from Lagos, NG on a new device for J. Whitfield, home is Columbus, OH">Submit a suspicious electronics purchase</button>
            <button class="suggestion-btn" data-msg="Submit a routine $42 grocery purchase in Columbus, OH for J. Whitfield on a known device">Submit a routine grocery purchase</button>
            <button class="suggestion-btn" data-msg="What does device_new affect?">Ask how the pipeline works</button>
          </div>
        </div>
      </div>
      <div class="chat-input-row">
        <textarea id="chatInput" placeholder="Ask Sentinel anything, or tell it what to do…" rows="1"></textarea>
        <button class="chat-send" id="chatSend">Send</button>
      </div>
    </section>

    <aside class="sidebar-col">
      <button class="btn primary new-case-btn" id="newCaseBtn">+ New case (guided form)</button>

      <section class="panel form-panel" id="formPanel" hidden>
        <div class="panel-head" style="padding:0 0 10px;"><h2>Submit via form</h2></div>
        <div class="field-grid">
          <div class="field full"><label>Merchant / payee</label><input id="f-merchant"></div>
          <div class="field"><label>Amount</label><input id="f-amount" type="number"></div>
          <div class="field"><label>Currency</label>
            <select id="f-currency"><option>USD</option><option>EUR</option><option>GBP</option><option>CAD</option><option>INR</option></select>
          </div>
          <div class="field"><label>Category</label>
            <select id="f-category"><option value="electronics">Electronics</option><option value="grocery">Grocery</option><option value="travel">Travel</option><option value="dining">Dining</option><option value="wire">Wire</option><option value="jewelry">Jewelry</option><option value="other">Other</option></select>
          </div>
          <div class="field"><label>Channel</label>
            <select id="f-channel"><option value="ecommerce">E-commerce</option><option value="card_present">Card present</option><option value="wire_transfer">Wire transfer</option></select>
          </div>
          <div class="field"><label>Origin</label><input id="f-geo" placeholder="Lagos, NG"></div>
          <div class="field"><label>Home location</label><input id="f-home-geo" placeholder="Columbus, OH"></div>
          <div class="field"><label>Device new?</label>
            <select id="f-device-new"><option value="false">Known</option><option value="true">New</option></select>
          </div>
          <div class="field"><label>New payee?</label>
            <select id="f-new-payee"><option value="false">No</option><option value="true">Yes</option></select>
          </div>
          <div class="field full"><label>Account holder / business name</label><input id="f-name"></div>
        </div>
        <button class="btn primary" id="formSubmitBtn">Run review</button>
        <div id="formError" style="font-size:11.5px;color:var(--critical);margin-top:6px;"></div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>Overview</h2></div>
        <div class="stat-tiles" id="statTiles"></div>
        <div class="chart-block">
          <div class="chart-title">Decisions</div>
          <div id="decisionChart"></div>
        </div>
        <div class="chart-block">
          <div class="chart-title">Composite score trend</div>
          <div id="scoreTrend"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Case queue</h2>
          <span class="count-chip" id="queueCount">0</span>
        </div>
        <div class="queue-panel"><div class="queue-list" id="queueList"><div class="queue-empty">No cases yet.</div></div></div>
      </section>
    </aside>
  </div>
</div>

<script>
(function(){
  const API = "";
  const NODE_LABELS = {
    supervisor: 'Supervisor', risk_analysis: 'Risk Analysis', compliance: 'Compliance',
    aggregator: 'Risk Aggregator', decision: 'Decision Router', human_review: 'Analyst Decision',
    narrative: 'Narrative Agent',
  };
  const PARALLEL = ['risk_analysis', 'compliance'];
  const BANDS = [{max:24,key:'good',label:'Low'},{max:49,key:'warning',label:'Watch'},{max:74,key:'serious',label:'Elevated'},{max:101,key:'critical',label:'Critical'}];
  const bandFor = (s) => BANDS.find(b => s <= b.max);

  let cases = {};
  let lastCaseId = null;
  let chatHistory = [];
  const streaming = new Set();

  async function api(path, opts) {
    const res = await fetch(API + path, opts);
    if (!res.ok) throw new Error((await res.text()) || res.statusText);
    return res.json();
  }
  function fmtMoney(n, ccy) {
    n = Number(n || 0);
    return (ccy === 'USD' ? '$' : '') + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function formatReply(text) {
    // Minimal **bold** + paragraph handling for the assistant's plain-text replies.
    const escaped = escapeHtml(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    return escaped.split(/\n\n+/).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
  }
  function statusLabel(status) {
    return { queued:'Queued', running:'Running', escalated:'Escalated', approve:'Approved', decline:'Declined', error:'Error', interrupted:'Interrupted' }[status] || status;
  }

  // ------------------------------------------------------------------ boot --
  async function boot() {
    try {
      const list = await api('/api/cases');
      list.forEach(c => { cases[c.id] = c; });
      setLive(true);
    } catch (e) { setLive(false); }
    renderSidebar();
  }
  function setLive(ok) {
    document.getElementById('liveDot').className = 'live-dot ' + (ok ? 'on' : 'off');
    document.getElementById('liveText').textContent = ok ? 'Connected to Sentinel API' : 'API unreachable';
  }

  // ------------------------------------------------------------------ chat --
  function appendMessage(role, html) {
    const log = document.getElementById('chatLog');
    const empty = log.querySelector('.chat-empty');
    if (empty) empty.remove();
    const row = document.createElement('div');
    row.className = 'msg-row ' + role;
    row.innerHTML = `<div class="bubble">${html}</div>`;
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return row.querySelector('.bubble');
  }

  async function sendChat(text) {
    const input = document.getElementById('chatInput');
    const msg = (text ?? input.value).trim();
    if (!msg) return;
    input.value = '';
    input.style.height = 'auto';
    appendMessage('user', escapeHtml(msg));
    chatHistory.push({ role: 'user', content: msg });

    const sendBtn = document.getElementById('chatSend');
    sendBtn.disabled = true;
    const thinkingBubble = appendMessage('assistant', '<span class="thinking">Thinking…</span>');

    try {
      const { reply, action } = await api('/api/assistant/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: chatHistory }),
      });
      chatHistory.push({ role: 'assistant', content: reply });
      thinkingBubble.innerHTML = formatReply(reply);
      await handleAction(action, thinkingBubble.parentElement);
    } catch (e) {
      thinkingBubble.innerHTML = formatReply('Sorry, something went wrong: ' + e.message);
    } finally {
      sendBtn.disabled = false;
    }
  }

  function resolveCaseId(action) {
    if (action.case_id && cases[action.case_id]) return action.case_id;
    if (action.merchant_hint) {
      const hit = Object.values(cases).find(c => (c.transaction.merchant || '').toLowerCase().includes(action.merchant_hint.toLowerCase()));
      if (hit) return hit.id;
    }
    return lastCaseId;
  }

  async function handleAction(action, chatRow) {
    if (!action) return;

    if (action.type === 'submit') {
      const { id } = await api('/api/cases', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ transaction: action.transaction, customer_profile: action.customer_profile }),
      });
      lastCaseId = id;
      cases[id] = {
        id, transaction: { ...action.transaction, id }, customer_profile: action.customer_profile,
        status: 'queued', route: [], findings: {}, risk_score: null, risk_factors: [],
        decision: null, narrative: null, audit_trail: [], created_at: Date.now() / 1000,
      };
      const card = document.createElement('div');
      card.className = 'case-card';
      chatRow.appendChild(card);
      renderCaseCard(id, card);
      startStream(id, card);
      renderSidebar();
      return;
    }

    if (action.type === 'lookup') {
      const id = resolveCaseId(action);
      if (!id || !cases[id]) {
        appendMessage('assistant', formatReply("I don't see a case matching that -- try giving me the transaction ID."));
        return;
      }
      try {
        cases[id] = await api(`/api/cases/${id}`);
      } catch (e) { /* use cached copy */ }
      lastCaseId = id;
      const card = document.createElement('div');
      card.className = 'case-card';
      chatRow.appendChild(card);
      renderCaseCard(id, card);
      return;
    }

    if (action.type === 'resume') {
      const id = resolveCaseId(action);
      if (!id || !cases[id]) {
        appendMessage('assistant', formatReply("I don't have a case to act on -- which one did you mean?"));
        return;
      }
      if (cases[id].status !== 'escalated') {
        appendMessage('assistant', formatReply(`${id} isn't awaiting analyst review right now (status: ${statusLabel(cases[id].status)}).`));
        return;
      }
      try {
        const full = await api(`/api/cases/${id}/resume`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ decision: action.decision }),
        });
        cases[id] = full;
        lastCaseId = id;
        const card = document.createElement('div');
        card.className = 'case-card';
        chatRow.appendChild(card);
        renderCaseCard(id, card);
        renderSidebar();
      } catch (e) {
        appendMessage('assistant', formatReply('Could not resume that case: ' + e.message));
      }
      return;
    }

    if (action.type === 'list') {
      let list = Object.values(cases);
      if (action.status_filter) list = list.filter(c => c.status === action.status_filter);
      list.sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
      if (!list.length) {
        appendMessage('assistant', formatReply('No matching cases.'));
        return;
      }
      const html = list.slice(0, 8).map(c =>
        `<div class="case-factor"><b>${escapeHtml(c.transaction.merchant || c.id)}</b> — ${fmtMoney(c.transaction.amount, c.transaction.currency)} — ${statusLabel(c.status)}${c.risk_score != null ? ' — score ' + c.risk_score : ''}</div>`
      ).join('');
      appendMessage('assistant', `<div class="case-card">${html}</div>`);
      return;
    }
  }

  // ------------------------------------------------------------ case cards --
  function renderEvidenceTable(citations) {
    if (!citations || !citations.length) return '';
    const rows = citations.map(c => `
      <tr>
        <td>${escapeHtml(c.label || '')}</td>
        <td>${escapeHtml(c.excerpt || '')}</td>
        <td><span class="prov-badge ${c.provenance === 'real' ? 'real' : 'simulated'}">${c.provenance === 'real' ? 'Real' : 'Simulated'}</span></td>
      </tr>`).join('');
    return `
      <div class="case-evidence-wrap">
        <table class="case-evidence">
          <thead><tr><th>Signal</th><th>Basis for the score</th><th>Source</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  function deriveNodeStates(c) {
    const s = {};
    s.supervisor = (c.route || []).length > 0 ? { status: 'done', note: `Routed to: ${c.route.join(', ')}` } : { status: 'running', note: '' };
    PARALLEL.forEach(key => {
      if (!(c.route || []).length) { s[key] = { status: 'pending', note: '' }; return; }
      if (!c.route.includes(key)) { s[key] = { status: 'skip', note: 'Not required — fast-path' }; return; }
      const f = c.findings[key];
      if (!f) { s[key] = { status: 'running', note: 'Analyzing…' }; return; }
      s[key] = { status: f.score == null ? 'na' : 'done', note: f.reason };
    });
    const allIn = (c.route || []).length > 0 && c.route.every(k => c.findings[k]);
    s.aggregator = c.risk_score != null ? { status: 'done', note: `Composite ${c.risk_score}/100` } : { status: allIn ? 'running' : 'pending', note: '' };
    if (c.status === 'escalated' && !c.decision) s.decision = { status: 'review', note: 'Escalated — awaiting analyst decision' };
    else if (c.decision) s.decision = { status: 'done', note: c.decision === 'approve' ? 'Approved.' : c.decision === 'decline' ? 'Declined.' : `Decision: ${c.decision}` };
    else s.decision = { status: c.risk_score != null ? 'running' : 'pending', note: '' };
    if (c.narrative) s.narrative = { status: 'done', note: 'Case note generated.' };
    else if (c.status === 'approve') s.narrative = { status: 'skip', note: 'Not required for auto-approved cases.' };
    else s.narrative = { status: 'pending', note: '' };
    return s;
  }

  function renderCaseCard(id, container) {
    const c = cases[id];
    if (!c) return;
    const t = c.transaction;
    const states = deriveNodeStates(c);
    const order = ['supervisor', ...PARALLEL, 'aggregator', 'decision', 'narrative'];
    const steps = order.map(k => {
      const st = states[k];
      return `<div class="case-step"><span class="dot ${st.status}"></span><span class="label">${NODE_LABELS[k]}</span><span class="detail">${escapeHtml(st.note || '')}</span></div>`;
    }).join('');

    const factorSource = (c.risk_factors && c.risk_factors.length)
      ? c.risk_factors
      : Object.entries(c.findings).map(([agent, f]) => ({ agent, score: f.score, reason: f.reason, citations: f.citations }));
    const factorsHtml = factorSource.length ? factorSource.map(f => `
      <div>
        <div class="case-factor-head"><b>${NODE_LABELS[f.agent] || f.agent}</b> (${f.score ?? 'n/a'}): ${escapeHtml(f.reason || '')}</div>
        ${renderEvidenceTable(f.citations)}
      </div>
    `).join('') : '';

    const scoreHtml = c.risk_score != null
      ? `<div class="case-score-line">Risk score: <span class="score band-${bandFor(c.risk_score).key}">${c.risk_score}/100 (${bandFor(c.risk_score).label})</span></div>`
      : '';

    const canResume = c.status === 'escalated' && !c.decision;
    const actionsHtml = canResume
      ? `<div class="case-actions"><button class="btn approve" data-resume="approve">Approve</button><button class="btn decline" data-resume="decline">Decline</button></div>`
      : '';

    container.innerHTML = `
      <div class="case-card-head"><span>${escapeHtml(t.merchant || t.id)}</span><span class="chip st-${c.status}">${statusLabel(c.status)}</span></div>
      <div class="case-card-meta">${t.id} · ${fmtMoney(t.amount, t.currency)} · ${escapeHtml(t.geo || '')}</div>
      <div class="case-steps">${steps}</div>
      ${scoreHtml}
      ${factorsHtml ? `<div class="case-factors">${factorsHtml}</div>` : ''}
      ${c.narrative ? `<div class="case-narrative">${escapeHtml(c.narrative)}</div>` : ''}
      ${actionsHtml}
    `;
    container.dataset.caseId = id;
    if (canResume) {
      container.querySelectorAll('[data-resume]').forEach(btn => {
        btn.addEventListener('click', async () => {
          btn.closest('.case-actions').innerHTML = '<span class="thinking">Working…</span>';
          try {
            const full = await api(`/api/cases/${id}/resume`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ decision: btn.dataset.resume }),
            });
            cases[id] = full;
            renderCaseCard(id, container);
            renderSidebar();
          } catch (e) {
            appendMessage('assistant', formatReply('Could not resume: ' + e.message));
          }
        });
      });
    }
  }

  function startStream(id, card) {
    if (streaming.has(id)) return;
    streaming.add(id);
    const es = new EventSource(`${API}/api/cases/${id}/stream`);
    const apply = (update) => {
      const c = cases[id];
      if (update.findings) Object.assign(c.findings, update.findings);
      if (update.route) c.route = update.route;
      if (update.risk_score !== undefined) c.risk_score = update.risk_score;
      if (update.risk_factors) c.risk_factors = update.risk_factors;
      if (update.decision) c.decision = update.decision;
      if (update.narrative) c.narrative = update.narrative;
      if (c.status === 'queued') c.status = 'running';
    };
    es.addEventListener('update', (ev) => { apply(JSON.parse(ev.data).payload); renderCaseCard(id, card); renderSidebar(); });
    es.addEventListener('escalated', (ev) => {
      const p = JSON.parse(ev.data);
      cases[id].status = 'escalated'; cases[id].risk_score = p.risk_score ?? cases[id].risk_score; cases[id].risk_factors = p.risk_factors ?? cases[id].risk_factors;
      renderCaseCard(id, card); renderSidebar();
    });
    es.addEventListener('snapshot', (ev) => { cases[id] = JSON.parse(ev.data); renderCaseCard(id, card); renderSidebar(); });
    es.addEventListener('done', () => {
      streaming.delete(id); es.close();
      api(`/api/cases/${id}`).then(full => { cases[id] = full; renderCaseCard(id, card); renderSidebar(); }).catch(() => {});
    });
    es.addEventListener('error', () => { streaming.delete(id); es.close(); });
  }

  document.getElementById('chatSend').addEventListener('click', () => sendChat());
  document.getElementById('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); } });
  document.getElementById('chatInput').addEventListener('input', (e) => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px'; });
  document.querySelectorAll('.suggestion-btn').forEach(btn => btn.addEventListener('click', () => sendChat(btn.dataset.msg)));

  // -------------------------------------------------------------- form panel --
  const newCaseBtn = document.getElementById('newCaseBtn');
  const formPanel = document.getElementById('formPanel');
  newCaseBtn.addEventListener('click', () => {
    formPanel.hidden = !formPanel.hidden;
    newCaseBtn.textContent = formPanel.hidden ? '+ New case (guided form)' : '– Hide form';
  });
  document.getElementById('formSubmitBtn').addEventListener('click', async () => {
    const errEl = document.getElementById('formError');
    errEl.textContent = '';
    const amount = parseFloat(document.getElementById('f-amount').value || '0');
    const merchant = document.getElementById('f-merchant').value.trim();
    if (!amount || !merchant) { errEl.textContent = 'Amount and merchant are required.'; return; }
    const geo = document.getElementById('f-geo').value.trim() || 'Unknown';
    const transaction = {
      amount, currency: document.getElementById('f-currency').value, merchant,
      category: document.getElementById('f-category').value, channel: document.getElementById('f-channel').value,
      geo, home_geo: document.getElementById('f-home-geo').value.trim() || geo,
      device_id: `dev-${Math.random().toString(16).slice(2, 10)}`,
      device_new: document.getElementById('f-device-new').value === 'true',
      ip_address: `203.0.113.${Math.floor(Math.random() * 254) + 1}`,
      new_payee: document.getElementById('f-new-payee').value === 'true',
    };
    const customer_profile = {
      account_id: `acct-${Math.random().toString(16).slice(2, 10)}`,
      name: document.getElementById('f-name').value.trim() || 'Unspecified',
      prior_flag_count: 0,
    };
    try {
      const { id } = await api('/api/cases', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ transaction, customer_profile }),
      });
      lastCaseId = id;
      cases[id] = { id, transaction: { ...transaction, id }, customer_profile, status: 'queued', route: [], findings: {}, risk_score: null, risk_factors: [], decision: null, narrative: null, audit_trail: [], created_at: Date.now() / 1000 };
      formPanel.hidden = true;
      newCaseBtn.textContent = '+ New case (guided form)';
      appendMessage('user', escapeHtml(`Submitted via form: ${merchant}, ${fmtMoney(amount, transaction.currency)}`));
      const bubble = appendMessage('assistant', 'Running the review now…');
      const card = document.createElement('div');
      card.className = 'case-card';
      bubble.appendChild(card);
      renderCaseCard(id, card);
      startStream(id, card);
      renderSidebar();
    } catch (e) {
      errEl.textContent = e.message;
    }
  });

  // ---------------------------------------------------------------- sidebar --
  function renderSidebar() {
    renderStatTiles();
    renderDecisionChart();
    renderScoreTrend();
    renderQueue();
  }

  function renderStatTiles() {
    const list = Object.values(cases);
    const counts = { total: list.length, escalated: 0, approve: 0, decline: 0 };
    list.forEach(c => { if (c.status === 'escalated') counts.escalated++; else if (c.status === 'approve') counts.approve++; else if (c.status === 'decline') counts.decline++; });
    const tiles = [
      { label: 'Total', value: counts.total }, { label: 'Awaiting', value: counts.escalated },
      { label: 'Approved', value: counts.approve }, { label: 'Declined', value: counts.decline },
    ];
    document.getElementById('statTiles').innerHTML = tiles.map(t => `<div class="stat-tile"><div class="stat-label">${t.label}</div><div class="stat-value tnum">${t.value}</div></div>`).join('');
  }

  function renderDecisionChart() {
    const list = Object.values(cases);
    const counts = { approve: 0, decline: 0, escalated: 0, pending: 0 };
    list.forEach(c => {
      if (c.status === 'approve') counts.approve++;
      else if (c.status === 'decline') counts.decline++;
      else if (c.status === 'escalated') counts.escalated++;
      else counts.pending++;
    });
    const rows = [
      { key: 'approve', label: 'Approved', n: counts.approve },
      { key: 'decline', label: 'Declined', n: counts.decline },
      { key: 'escalated', label: 'Escalated', n: counts.escalated },
      { key: 'pending', label: 'In progress', n: counts.pending },
    ];
    const max = Math.max(1, ...rows.map(r => r.n));
    document.getElementById('decisionChart').innerHTML = rows.map(r => `
      <div class="bar-row">
        <span>${r.label}</span>
        <div class="bar-track"><div class="bar-fill st-${r.key}" style="width:${(r.n / max) * 100}%"></div></div>
        <span class="bar-count tnum">${r.n}</span>
      </div>`).join('');
  }

  function renderScoreTrend() {
    const el = document.getElementById('scoreTrend');
    const list = Object.values(cases).filter(c => c.risk_score != null).sort((a, b) => (a.created_at || 0) - (b.created_at || 0)).slice(-12);
    if (list.length < 2) { el.innerHTML = '<div class="trend-empty">Not enough scored cases yet.</div>'; return; }

    const w = 300, h = 90, pad = 8;
    const xStep = (w - pad * 2) / (list.length - 1);
    const yFor = (score) => pad + (1 - score / 100) * (h - pad * 2);
    const points = list.map((c, i) => [pad + i * xStep, yFor(c.risk_score)]);
    const path = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');

    const dots = points.map((p, i) => {
      const c = list[i];
      return `<circle class="trend-dot" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3">
        <title>${escapeHtml(c.transaction.merchant || c.id)}: ${c.risk_score}/100</title>
      </circle>`;
    }).join('');

    el.innerHTML = `
      <svg class="trend-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <line class="trend-threshold" x1="${pad}" y1="${yFor(25).toFixed(1)}" x2="${w - pad}" y2="${yFor(25).toFixed(1)}"/>
        <line class="trend-threshold" x1="${pad}" y1="${yFor(90).toFixed(1)}" x2="${w - pad}" y2="${yFor(90).toFixed(1)}"/>
        <text class="trend-axis-label" x="${pad}" y="${(yFor(25) - 2).toFixed(1)}">approve ≤25</text>
        <text class="trend-axis-label" x="${pad}" y="${(yFor(90) - 2).toFixed(1)}">decline ≥90</text>
        <path class="trend-line" d="${path}"/>
        ${dots}
      </svg>`;
  }

  function bandKeyForCase(c) {
    if (c.risk_score == null) return 'pending';
    return bandFor(c.risk_score).key;
  }

  function renderQueue() {
    const list = Object.values(cases).sort((a, b) => (b.created_at || 0) - (a.created_at || 0));
    document.getElementById('queueCount').textContent = list.length;
    const el = document.getElementById('queueList');
    if (!list.length) { el.innerHTML = '<div class="queue-empty">No cases yet.</div>'; return; }
    el.innerHTML = list.map(c => {
      const bk = bandKeyForCase(c);
      const stripeColor = bk === 'pending' ? 'var(--line)' : `var(--${bk})`;
      return `
      <button class="queue-item" data-id="${c.id}">
        <span class="stripe" style="background:${stripeColor}"></span>
        <span class="qi-body">
          <span class="qi-merchant">${escapeHtml(c.transaction.merchant || c.id)}</span>
          <span class="qi-meta"><span>${fmtMoney(c.transaction.amount, c.transaction.currency)}</span><span class="chip st-${c.status}">${statusLabel(c.status)}</span></span>
        </span>
      </button>`;
    }).join('');
    el.querySelectorAll('.queue-item').forEach(btn => {
      btn.addEventListener('click', () => sendChat(`Show me case ${btn.dataset.id}`));
    });
  }

  boot();
})();
</script>
</body>
</html>
